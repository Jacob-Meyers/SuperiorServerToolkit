plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '9.2.1'
}

group = 'com.jeyers'
version = '1.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT")
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.kyori:adventure-api:4.17.0'
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def createVersionJar(String versionSuffix, int javaVersion) {
    def sourceSetName = "java${javaVersion}"

    sourceSets {
        create(sourceSetName) {
            java.srcDirs = [file("src/main/java")]
            resources.srcDirs = [file("src/main/resources")]
        }
    }

    configurations.named("${sourceSetName}CompileOnly") {
        extendsFrom configurations.compileOnly
    }
    configurations.named("${sourceSetName}Implementation") {
        extendsFrom configurations.implementation
    }

    tasks.named("compile${sourceSetName.capitalize()}Java", JavaCompile) {
        options.encoding = 'UTF-8'
        options.release.set(javaVersion)
        options.compilerArgs << "-Xlint:deprecation"

        // Explicitly map Java toolchain matching the target version
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    return tasks.register("shadowJar${versionSuffix}", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
        dependsOn tasks.named("processResources")
        from sourceSets.named(sourceSetName).get().output
        configurations = [project.configurations.named("${sourceSetName}RuntimeClasspath").get()]

        archiveBaseName.set("Superior Server Toolkit")
        archiveClassifier.set(versionSuffix)
        destinationDirectory.set(layout.buildDirectory.dir("out-jars"))
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        relocate('net.kyori.adventure', 'com.jeyers.shaded.adventure')
    }
}

def jar17 = createVersionJar("Java17", 17)
def jar21 = createVersionJar("Java21", 21)
def jar25 = createVersionJar("Java25", 25)

tasks.build {
    dependsOn(jar17, jar21, jar25)
}

tasks {
    runServer {
        minecraftVersion("1.18")
    }
}